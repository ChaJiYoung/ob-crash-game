#cloud-config
# Runs once on first boot. "azureuser" must match AZ_ADMIN_USER in scripts/azure/config.sh.
# Keep this file ASCII-only: az vm create fails to encode non-latin-1 characters in --custom-data.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - ca-certificates
  - curl
runcmd:
  # 2GB swap as a safety net for the 1GB RAM VM
  - [ bash, -c, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab" ]
  - [ systemctl, enable, --now, docker ]
  - [ usermod, -aG, docker, azureuser ]
  - [ bash, -c, "mkdir -p /opt/ob-crash/data && chown -R azureuser:azureuser /opt/ob-crash" ]
