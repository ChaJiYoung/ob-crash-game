# 레거시: 오라클 VM에서 소스를 직접 빌드하는 구성. 현재 운영 경로는 deploy/azure (이미지 기반).
# 실행: docker compose -f deploy/oracle/docker-compose.yml up -d --build  (.env는 이 폴더에 둔다)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8787"
      TRUST_PROXY: "1"
      ALLOWED_ORIGIN: "https://${DOMAIN:-localhost}"
      WS_MAX_CONN_PER_IP: "${WS_MAX_CONN_PER_IP:-60}"
      WS_MAX_CONN_TOTAL: "${WS_MAX_CONN_TOTAL:-300}"
    volumes:
      - ${DATA_DIR:-../../data}:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  web:
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
