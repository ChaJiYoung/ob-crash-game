<!DOCTYPE html>
<html lang="ko" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비어 크러셔 (Beer Crusher) — Three.js 3D 실물 타겟 & 3대 스테이지 시안</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { interpolate-size: allow-keywords; }

    html.theme-dark {
      --bg: #0A0A0A; --surface: #141414; --surface-hover: #1C1C1C;
      --border: rgba(255,255,255,0.1);
      --text: #EDEDED; --text-secondary: #94a3b8;
      --accent: #f59e0b; --accent-secondary: #3b82f6;
      --positive: #10b981; --negative: #f43f5e; --warning: #f59e0b;
    }
    html.theme-light {
      --bg: #F8FAFC; --surface: #FFFFFF; --surface-hover: #F1F5F9;
      --border: rgba(0,0,0,0.1);
      --text: #0f172a; --text-secondary: #64748b;
      --accent: #d97706; --accent-secondary: #2563eb;
      --positive: #059669; --negative: #e11d48; --warning: #d97706;
    }

    body {
      font-family: 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.5; -webkit-font-smoothing: antialiased;
      padding: 20px 24px 60px;
      user-select: none; -webkit-user-select: none;
    }
    h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; }
    h2 { font-size: 1.4rem; font-weight: 700; }
    h3 { font-size: 1.1rem; font-weight: 600; }

    .container { max-width: 1280px; margin: 0 auto; }

    /* Menu */
    .viz-menu { position: fixed; top: 16px; right: 16px; z-index: 9999; }
    .viz-menu-toggle {
      width: 42px; height: 42px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .viz-menu-dropdown {
      position: absolute; top: 48px; right: 0; min-width: 180px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 6px;
      opacity: 0; visibility: hidden; transform: translateY(-8px);
      transition: all 0.2s;
    }
    .viz-menu-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
    .viz-menu-dropdown button {
      width: 100%; padding: 8px 12px; border: none; border-radius: 6px;
      background: transparent; color: var(--text); font-size: 13px;
      cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px;
    }
    .viz-menu-dropdown button:hover { background: var(--surface-hover); }

    /* Concept Selector Tabs */
    .stage-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    @media (max-width: 768px) { .stage-tabs { grid-template-columns: 1fr; } }
    .stage-tab {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      color: var(--text);
    }
    .stage-tab:hover { background: var(--surface-hover); }
    .stage-tab.active {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.1);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .stage-tab-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent);
      margin-bottom: 4px;
    }

    /* HUD Bar from beer_crusher_mockup_v2 */
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      background: var(--surface);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .row b { color: var(--text); font-weight: 700; font-size: 15px; }

    /* Main 3D Viewport Wrapper */
    #wrap {
      position: relative;
      width: 100%;
      height: 540px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--border);
      touch-action: none;
      cursor: crosshair;
      background: #111;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    }

    /* Action Buttons below viewport */
    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .btns button {
      flex: 1;
      min-width: 120px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      touch-action: none;
      transition: all 0.15s;
    }
    .btns button:hover { background: var(--surface-hover); border-color: var(--accent); }
    .btns button.on { background: rgba(59, 130, 246, 0.25); border-color: #3b82f6; }
    #b3[disabled] { opacity: 0.45; cursor: not-allowed; }
    #b3.rdy {
      background: #FAC775;
      border-color: #BA7517;
      color: #412402;
      font-weight: 800;
    }

    /* Spawn & Inspection Toolbar */
    .spawn-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
    }
    .spawn-bar button {
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-hover);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .spawn-bar button:hover { border-color: var(--accent); color: var(--accent); }

    /* 3D Showcase Gallery for Close-up Inspection */
    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .showcase-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .showcase-card h4 { font-size: 14px; font-weight: 700; margin-top: 6px; }
    .showcase-card p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="viz-menu">
    <button class="viz-menu-toggle" onclick="toggleMenu()" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/>
      </svg>
    </button>
    <div class="viz-menu-dropdown" id="vizMenuDropdown">
      <button onclick="cycleTheme()"><span id="themeIcon">🌙</span><span id="themeLabel">Dark</span></button>
      <button onclick="window.print()"><span>🖨️</span><span>Print</span></button>
    </div>
  </div>

  <main id="main-content" class="container">
    <section style="margin-bottom: 14px;">
      <h1>비어 크러셔 (Beer Crusher) — Three.js 3D 목업 & 3대 스테이지 시안</h1>
      <p style="color: var(--text-secondary); font-size: 14px; margin-top: 4px;">
        기존 <code>beer_crusher_mockup_v2.html</code>의 Three.js 3D 엔진 위에 <strong>OB맥주 실물 캔 4종 + 투명 유리 생맥주잔 + 업소용 생맥주 냉각기(보스) + 1인칭 생맥주 탭건</strong>과 <strong>3가지 3D 스테이지 배경 시안</strong>을 직접 플레이하며 비교할 수 있도록 구성했습니다.
      </p>

      <!-- 3D STAGE CONCEPT TABS -->
      <div class="stage-tabs">
        <button class="stage-tab active" id="st-0" onclick="setStageTheme(0)">
          <span class="stage-tab-badge">시안 1 · 추천 (Recommended)</span>
          <h3>1. 오비맥주 브루어리 & 펍 홀 (3D)</h3>
          <p style="font-size:12px; color:var(--text-secondary); margin-top:3px;">
            원목 바 카운터 방어선 + 양옆 구리 숙성 탱크 + 벽면 네온사인 + 따뜻한 브루어리 조명
          </p>
        </button>
        <button class="stage-tab" id="st-1" onclick="setStageTheme(1)">
          <span class="stage-tab-badge">시안 2 · 인더스트리얼</span>
          <h3>2. 스마트 양조장 컨베이어 벨트 (3D)</h3>
          <p style="font-size:12px; color:var(--text-secondary); margin-top:3px;">
            3레일 컨베이어 트랙 + 롤러 라인 + 안전 펜스 바리케이드 + 스테인리스 탱크 라인
          </p>
        </button>
        <button class="stage-tab" id="st-2" onclick="setStageTheme(2)">
          <span class="stage-tab-badge">시안 3 · 아이스 쇼케이스</span>
          <h3>3. 워크인(Walk-in) 맥주 냉각 창고 (3D)</h3>
          <p style="font-size:12px; color:var(--text-secondary); margin-top:3px;">
            영하 4°C 아이스 블루 안개 + 양옆 파란색 OB맥주 플라스틱 상자(크레이트) 적재 스택
          </p>
        </button>
      </div>
    </section>

    <!-- GAME VIEWPORT SECTION (FROM beer_crusher_mockup_v2.html) -->
    <section>
      <div class="row">
        <span>점수 <b id="sc">0</b></span>
        <span>웨이브 <b id="wv">1</b></span>
        <span>콤보 <b id="cb">0</b></span>
        <span>탄창 <b id="am">10/10</b></span>
      </div>
      <div class="row">
        <span>체력 (1.8m 방어선)</span>
        <span id="hpbar" style="display:flex;gap:3px;flex:1;max-width:420px;"></span>
        <span id="bf" style="font-weight:600; color:var(--accent);">효과 없음</span>
      </div>

      <div id="wrap">
        <!-- Crosshair + Fever Ring + Reload Bar -->
        <div id="ch" style="position:absolute;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:10;">
          <svg width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4"></circle>
            <circle id="fr" cx="32" cy="32" r="26" fill="none" stroke="#EF9F27" stroke-width="4" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 32 32)"></circle>
            <circle cx="32" cy="32" r="12" fill="none" stroke="#E24B4A" stroke-width="2"></circle>
            <path d="M32 12v12M32 40v12M12 32h12M40 32h12" stroke="#E24B4A" stroke-width="2"></path>
          </svg>
          <div id="rl" style="position:absolute;left:12px;top:60px;width:40px;height:5px;background:rgba(0,0,0,0.45);display:none;border-radius:3px;">
            <div id="rlf" style="height:100%;width:0;background:#38BDF8;border-radius:3px;"></div>
          </div>
        </div>

        <!-- Popups & Banners -->
        <div id="pop" style="position:absolute;transform:translate(-50%,-50%);font-size:22px;font-weight:800;opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,0.6);z-index:11;"></div>
        <div id="pop2" style="position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);font-size:19px;font-weight:800;opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,0.6);z-index:11;"></div>
        <div id="bn" style="position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.88);border:1px solid rgba(245,158,11,0.5);border-radius:99px;padding:6px 18px;font-size:14px;font-weight:700;color:#FEF08A;display:none;white-space:nowrap;pointer-events:none;z-index:11;"></div>
        <div id="boss" style="position:absolute;top:52px;left:20%;width:60%;height:12px;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.25);border-radius:6px;display:none;pointer-events:none;z-index:11;">
          <div id="bossf" style="height:100%;width:100%;background:linear-gradient(90deg,#E24B4A,#F59E0B);border-radius:6px;"></div>
        </div>
        <canvas id="mm" width="112" height="112" style="position:absolute;right:10px;bottom:10px;width:112px;height:112px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);pointer-events:none;z-index:11;"></canvas>
        <div id="ov" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(10,14,23,0.88);font-size:18px;color:#fff;z-index:20;"></div>
      </div>

      <!-- Controls -->
      <div class="btns">
        <button id="b1">💥 단발 사격 (스냅 / Space)</button>
        <button id="b2">🔥 연사 홀드 (꾹 / F키) · 더블탭=장전(R)</button>
        <button id="b3" disabled>⚡ FEVER 발동 (E키)</button>
        <button id="rs">🔄 처음부터 다시 시작</button>
      </div>

      <!-- Instant 3D Target Spawn Bar for Testing -->
      <div class="spawn-bar">
        <strong style="color:var(--accent);">🧪 3D 타겟 즉시 소환 테스트:</strong>
        <button onclick="spawnTest('boss')">🧊 보스: 업소용 OB 생맥주 냉각기 소환</button>
        <button onclick="spawnTest('mug')">🍺 생맥주 유리잔 (HP 3) 소환</button>
        <button onclick="spawnTest('obi')">🐻 오비라거 캔 소환</button>
        <button onclick="spawnTest('caslight')">🦇 카스 라이트 (날개캔) 소환</button>
        <button onclick="spawnTest('hanmac')">🌿 한맥 크림캔 (HP 3) 소환</button>
        <button onclick="spawnTest('pilgood')">🐳 필굿 점프캔 소환</button>
        <button onclick="fillFeverNow()">⚡ 피버 게이지 100% 채우기</button>
      </div>
    </section>
  </main>

  <script>
    // Menu & Theme
    function toggleMenu() {
      var d = document.getElementById('vizMenuDropdown');
      if (d) d.classList.toggle('open');
    }
    var currentTheme = 'dark';
    function cycleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.className = 'theme-' + currentTheme;
    }

    // === THREE.JS 3D ENGINE (Upgraded from beer_crusher_mockup_v2.html) ===
    var $ = function(id) { return document.getElementById(id); };
    var clamp = function(v, a, b) { return Math.max(a, Math.min(b, v)); };
    var wrap = $('wrap');
    var W = wrap.clientWidth || 960, H = 540, FOV = 50, SPAWN_Z = -28, REACH_Z = -1.8;
    var MAG = 10, RELOAD = 1.2, HOLD_DELAY = 0.25, DOUBLE_TAP = 300, FREEZE = 0.15, FLICK_CD = 0.35, LERP = 0.25;
    var FEVER_DUR = 8, GREAT_R = 0.35;
    var GAUGE_GREAT = 20, GAUGE_GOOD = 10, GAUGE_MISS = 5;

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    renderer.shadowMap.enabled = true;
    renderer.domElement.style.display = 'block';
    wrap.insertBefore(renderer.domElement, wrap.firstChild);

    window.addEventListener('resize', function() {
      W = wrap.clientWidth || 960;
      renderer.setSize(W, H);
      cam.aspect = W / H;
      cam.updateProjectionMatrix();
    });

    var scene = new THREE.Scene();
    var cam = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 100);
    cam.position.set(0, 1.55, 0);
    cam.rotation.x = -0.04;
    scene.add(cam);
    cam.updateMatrixWorld(true);

    var hemiLight = new THREE.HemisphereLight(0xffffff, 0x443322, 0.95);
    scene.add(hemiLight);
    var sun = new THREE.DirectionalLight(0xfff5e0, 0.9);
    sun.position.set(4, 10, 5);
    scene.add(sun);

    // === 1st-Person Draft Beer Tap Gun (우하단 1인칭 생맥주 디스펜서 건) ===
    var gun = new THREE.Group();
    var gm = new THREE.MeshStandardMaterial({ color: 0x22262e, metalness: 0.65, roughness: 0.35 });
    var goldMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.75, roughness: 0.25 });
    var chromeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.85, roughness: 0.2 });

    gun.add(new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.15, 0.42), gm));
    var bar = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.042, 0.38, 16), chromeMat);
    bar.rotation.x = Math.PI / 2;
    bar.position.set(0, 0.02, -0.32);
    gun.add(bar);
    var nozzleRing = new THREE.Mesh(new THREE.TorusGeometry(0.042, 0.008, 8, 16), goldMat);
    nozzleRing.position.set(0, 0.02, -0.5);
    gun.add(nozzleRing);
    var lever = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.014, 0.22, 12), goldMat);
    lever.position.set(0, 0.16, -0.05);
    gun.add(lever);
    var leverKnob = new THREE.Mesh(new THREE.SphereGeometry(0.028, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }));
    leverKnob.position.set(0, 0.27, -0.05);
    gun.add(leverKnob);
    gun.position.set(0.32, -0.32, -0.58);
    cam.add(gun);

    // === 3D STAGE ENVIRONMENT BUILDER (시안 1 / 시안 2 / 시안 3) ===
    var stageGroup = new THREE.Group();
    scene.add(stageGroup);

    function makeSignTexture(text, bgHex, borderHex, textHex) {
      var cv = document.createElement('canvas');
      cv.width = 512; cv.height = 128;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = bgHex;
      ctx.fillRect(0, 0, 512, 128);
      ctx.strokeStyle = borderHex;
      ctx.lineWidth = 8;
      ctx.strokeRect(8, 8, 496, 112);
      ctx.fillStyle = textHex;
      ctx.font = '900 42px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 64);
      return new THREE.CanvasTexture(cv);
    }

    function setStageTheme(idx) {
      for (var i = 0; i < 3; i++) {
        var btn = $('st-' + i);
        if (btn) btn.classList.toggle('active', i === idx);
      }
      while (stageGroup.children.length > 0) {
        stageGroup.remove(stageGroup.children[0]);
      }

      if (idx === 0) {
        // 시안 1: 오비맥주 네온 펍 & 브루어리 홀 (3D)
        scene.background = new THREE.Color(0x18110c);
        scene.fog = new THREE.Fog(0x18110c, 22, 46);
        hemiLight.color.setHex(0xffe8c2);
        hemiLight.groundColor.setHex(0x3d2616);

        // Dark Wood Pub Floor
        var floor1 = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshStandardMaterial({ color: 0x2b1b12, roughness: 0.7, metalness: 0.1 }));
        floor1.rotation.x = -Math.PI / 2;
        stageGroup.add(floor1);

        // Center Brewery Track Carpet
        var carpet = new THREE.Mesh(new THREE.PlaneGeometry(15, 32), new THREE.MeshStandardMaterial({ color: 0x3b2314, roughness: 0.6 }));
        carpet.rotation.x = -Math.PI / 2;
        carpet.position.set(0, 0.01, -15);
        stageGroup.add(carpet);

        // 1.8m Foreground Wooden Bar Counter Defense Line
        var counter = new THREE.Mesh(new THREE.BoxGeometry(16, 0.95, 0.6), new THREE.MeshStandardMaterial({ color: 0x5c3419, roughness: 0.4, metalness: 0.15 }));
        counter.position.set(0, 0.47, REACH_Z);
        stageGroup.add(counter);
        var counterTop = new THREE.Mesh(new THREE.BoxGeometry(16.2, 0.08, 0.72), goldMat);
        counterTop.position.set(0, 0.96, REACH_Z);
        stageGroup.add(counterTop);

        // Copper Brewery Fermentation Tanks along left & right walls
        var copperMat = new THREE.MeshStandardMaterial({ color: 0xb45309, metalness: 0.65, roughness: 0.3 });
        [-9.5, 9.5].forEach(function(xPos) {
          [-6, -13, -20, -27].forEach(function(zPos) {
            var tank = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 5.2, 20), copperMat);
            tank.position.set(xPos, 2.6, zPos);
            stageGroup.add(tank);
            var dome = new THREE.Mesh(new THREE.SphereGeometry(1.4, 20, 12), copperMat);
            dome.position.set(xPos, 5.2, zPos);
            stageGroup.add(dome);
          });
        });

        // Neon Brand Signs at back & sides

    function spawnTest(k) {
      var zPos = k === 'boss' ? -15 : -12;
      var xPos = k === 'boss' ? 0 : (Math.random() * 6 - 3);
      spawn(k, xPos, zPos);
      pop2(CAN[k].name + ' (3D) 소환!', '#FEF08A');
    }

    function fillFeverNow() {
      S.gauge = 100;
      pop2('피버 게이지 100% 완충! FEVER 버튼(또는 E키)을 누르세요!', '#FAC775');
    }

    function burst(pos, col, big) {
      var n = big ? 24 : 14;
      for (var i = 0; i < n; i++) {
        var m = new THREE.Mesh(triGeo, fragMat(i % 2 ? 0xfbbf24 : col));
        m.position.copy(pos);
        m.scale.setScalar(big ? 3.2 : 1.2);
        scene.add(m);
        fx.push({
          m: m,
          v: new THREE.Vector3((Math.random() - 0.5) * 6, Math.random() * 5 + 1.2, (Math.random() - 0.3) * 5),
          rv: new THREE.Vector3(Math.random() * 10, Math.random() * 10, Math.random() * 10),
          life: 1, g: 12
        });
      }
      var f = big ? 34 : 24;
      for (var j = 0; j < f; j++) {
        var fm = new THREE.Mesh(foamGeo, foamMat);
        fm.position.copy(pos);
        fm.scale.setScalar(big ? 2.5 : 1.5);
        scene.add(fm);
        fx.push({
          m: fm,
          v: new THREE.Vector3((Math.random() - 0.5) * 3.2, Math.random() * 3.2 + 0.6, 4 + Math.random() * 5),
          rv: new THREE.Vector3(),
          life: 0.85, g: 3
        });
      }
    }

    function removeTarget(o) {
      scene.remove(o.g);
      var i = targets.indexOf(o);
      if (i >= 0) targets.splice(i, 1);
    }

    function dropItem(pos) {
      if (Math.random() >= 0.4) return;
      var k = pick(['heal', 'rapid', 'power', 'shield']);
      var g = makeItem(k);
      g.position.set(pos.x, clamp(pos.y, 0.9, 2.3), pos.z);
      scene.add(g);
      items.push({ kind: k, g: g, hitR: 0.5, life: 6, ph: Math.random() * 6 });
    }

    function kill(o) {
      burst(o.g.position, parseInt(o.c.bg.slice(1), 16), o.kind === 'boss');
      S.score += o.kind === 'boss' ? 500 : 50;
      dropItem(o.g.position);
      removeTarget(o);
    }

    var MS = { 5: ['NICE!', '#34D399'], 10: ['AWESOME!', '#38BDF8'], 15: ['UNSTOPPABLE!', '#FB923C'], 20: ['LEGENDARY!', '#F43F5E'] };
    function processHit(o, err) {
      var perfect = err <= 0.15;
      var great = !perfect && err <= 0.45;
      o.hp -= S.powerT > 0 ? 2 : 1;
      o.hitT = 0.15;
      S.combo++;
      var addScore = perfect ? 150 : (great ? 100 : 50);
      var addGauge = perfect ? 30 : (great ? 20 : 10);
      S.score += addScore;
      if (!S.fever) S.gauge = Math.min(100, S.gauge + addGauge * (S.combo >= 10 ? 2 : S.combo >= 5 ? 1.5 : 1));
      pop(perfect ? 'PERFECT!! +150' : (great ? 'GREAT! +100' : 'GOOD! +50'), perfect ? '#F43F5E' : (great ? '#FBBF24' : '#34D399'));
      var m = MS[S.combo] || (S.combo > 20 && S.combo % 5 === 0 ? ['LEGENDARY!', '#F43F5E'] : null);
      if (m) pop2('콤보 ' + S.combo + ' · ' + m[0], m[1]);
      if (o.kind === 'hanmac' || o.kind === 'mug') {
        var d = (o.maxhp - o.hp) / o.maxhp;
        var inn = o.g.userData.inner;
        inn.rotation.z = d * 0.28;
        inn.scale.x = 1 - d * 0.14;
      }
      if (o.hp <= 0) kill(o);
    }

    function collect(it) {
      var k = it.kind;
      if (k === 'heal') S.hp = Math.min(10, S.hp + 3);
      if (k === 'rapid') S.rapidT = 8;
      if (k === 'power') S.powerT = 8;
      if (k === 'shield') S.shield = true;
      S.score += 20;
      pop2(ITEM[k].name + ' 획득!', ITEM[k].lbl);
      scene.remove(it.g);
      var i = items.indexOf(it);
      if (i >= 0) items.splice(i, 1);
    }

    function missShot() {
      S.combo = 0;
      // 피버 게이지가 100까지 다 차면 잘못 맞춰도 내려가지 않음!
      if (!S.fever && S.gauge < 100) S.gauge = Math.max(0, S.gauge - GAUGE_MISS);
    }

    function startReload() {
      if (S.over || S.fever || S.reloadT > 0 || S.ammo === MAG) return;
      S.reloadT = RELOAD;
      vib([30, 40, 30]);
    }

    function shoot() {
      if (S.over) return;
      if (S.reloadT > 0) return;
      if (!S.fever && S.ammo <= 0) { startReload(); return; }
      if (!S.fever) S.ammo--;
      S.recoil = 1;
      vib(S.holdOn ? 15 : 40);
      var th = testHit(targets), ih = testHit(items);
      if (S.fever) {
        if (!th.length && !ih.length) return;
        th.forEach(function(h) { processHit(h.o, h.err); });
        ih.forEach(function(h) { collect(h.o); });
      } else if (th.length) {
        th.sort(function(a, b) { return a.dist - b.dist; });
        processHit(th[0].o, th[0].err);
      } else if (ih.length) {
        ih.sort(function(a, b) { return a.dist - b.dist; });
        collect(ih[0].o);
      } else {
        missShot();
      }
      if (!S.fever && S.ammo <= 0) startReload();
    }

    function flick() {
      if (S.over || S.flickCd > 0) return;
      S.flickCd = FLICK_CD; S.frozenT = FREEZE;
      shoot();
    }

    function fever() {
      if (S.over || S.fever || S.gauge < 100) return;
      S.fever = true; S.feverT = FEVER_DUR; S.ammo = MAG; S.reloadT = 0;
      pop2('🔥 FEVER 발동! 8초간 자동 관통 연사!', '#FBBF24');
      vib([60, 30, 60, 30, 60]);
    }

    function reach(o) {
      var d = o.c.dmg;
      if (S.shield) {
        S.shield = false;
        pop2('보호막이 피격을 방어했습니다!', '#38BDF8');
      } else {
        S.hp -= d; S.flashT = 0.4; vib(200);
      }
      S.combo = 0;
      burst(o.g.position, 0xcfd8dc, false);
      removeTarget(o);
      if (S.hp <= 0) gameOver();
    }

    function gameOver() {
      S.over = true;
      var ov = $('ov');
      ov.innerHTML = '<b style="font-weight:800;font-size:28px;color:#F43F5E;">GAME OVER</b><span>도달 웨이브 ' + S.wave + ' · 최종 점수 ' + S.score.toLocaleString() + '점</span><button id="rs2" style="padding:10px 24px;border-radius:8px;background:#F59E0B;border:none;font-weight:700;cursor:pointer;">다시 시작</button>';
      ov.style.display = 'flex';
      $('rs2').addEventListener('click', init);
    }

    function update(dt) {
      S.flickCd = Math.max(0, S.flickCd - dt);
      if (S.frozenT > 0) {
        S.frozenT -= dt;
      } else {
        var k = 1 - Math.pow(1 - LERP, dt * 60);
        cx += (tx - cx) * k; cy += (ty - cy) * k;
      }
      if (S.reloadT > 0) {
        S.reloadT -= dt;
        if (S.reloadT <= 0) { S.reloadT = 0; S.ammo = MAG; }
      }
      S.rapidT = Math.max(0, S.rapidT - dt);
      S.powerT = Math.max(0, S.powerT - dt);
      if (S.fever) {
        S.feverT -= dt;
        S.gauge = 100 * Math.max(0, S.feverT) / FEVER_DUR;
        // Fever auto-fire at ~18 shots/sec (every 0.055s) as specified in Section 5.6!
        S.fireCd -= dt;
        if (S.fireCd <= 0) {
          shoot();
          S.fireCd = 0.055;
        }
        if (S.feverT <= 0) { S.fever = false; S.gauge = 0; }
      } else if (S.holdOn) {
        S.holdT += dt;
        if (S.holdT >= HOLD_DELAY) {
          S.fireCd -= dt;
          if (S.fireCd <= 0) {
            shoot();
            S.fireCd = S.rapidT > 0 ? 0.06 : 0.125;
          }
        }
      }
      if (S.over) return;
      if (S.state === 'break') {
        S.breakT -= dt;
        if (S.breakT <= 0) startWave();
      } else {
        S.spawnT -= dt;
        if (S.spawnT <= 0 && targets.length < S.def.max) {
          if (S.bossPending) {
            spawn('boss'); S.bossPending = false; S.spawnT = 1.2;
          } else if (S.remain > 0) {
            spawn(pick(S.def.types)); S.remain--; S.spawnT = 0.6;
          }
        }
        if (S.remain <= 0 && !S.bossPending && targets.length === 0) endWave();
      }

      for (var i = 0; i < targets.length; i++) {
        var o = targets[i];
        o.t += dt; o.hitT = Math.max(0, o.hitT - dt);
        var g = o.g;
        g.position.z += o.sp * dt;
        var prog = clamp((g.position.z - SPAWN_Z) / (REACH_Z - SPAWN_Z), 0, 1);
        var x = o.x0 * (1 - prog), sx = 1, sy = 1;
        if (o.kind === 'caslight') {
          x += Math.sin(o.t * 2.2 + o.ph) * 1.8 * (1 - prog * 0.7);
          g.position.y = o.cy0 + Math.sin(o.t * 3) * 0.25;
          var f = Math.sin(o.t * 14) * 0.6, w = g.userData.wings;
          if (w) { w[0].rotation.z = -f; w[1].rotation.z = f; }
        } else if (o.kind === 'pilgood') {
          var h = Math.abs(Math.sin(o.t * 4.5 + o.ph));
          g.position.y = o.cy0 + h * 1.0;
          if (h < 0.12) { sx = 1.15; sy = 0.82; } else { sx = 0.95; sy = 1.06; }
        }
        g.position.x = x;
        var pu = o.hitT > 0 ? 1.12 : 1;
        g.scale.set(sx * pu, sy * pu, sx * pu);
        if (g.position.z > REACH_Z) {
          reach(o);
          if (S.over) return;
          i--;
        }
      }

      for (var j = items.length - 1; j >= 0; j--) {
        var it = items[j];
        it.life -= dt;
        var ig = it.g;
        ig.position.z += 1.5 * dt;
        ig.rotation.y += dt * 2;
        ig.position.y += Math.sin(performance.now() / 300 + it.ph) * 0.004;
        ig.visible = it.life > 1.5 || Math.floor(it.life * 8) % 2 === 0;
        if (it.life <= 0 || ig.position.z > -1.2) {
          scene.remove(ig);
          items.splice(j, 1);
        }
      }
    }

    function updateFx(dt) {
      for (var i = fx.length - 1; i >= 0; i--) {
        var f = fx[i];
        f.m.position.addScaledVector(f.v, dt);
        f.v.y -= f.g * dt;
        f.m.rotation.x += f.rv.x * dt;
        f.m.rotation.y += f.rv.y * dt;
        f.m.rotation.z += f.rv.z * dt;
        f.life -= dt;
        if (f.life <= 0 || f.m.position.y < 0) {
          scene.remove(f.m);
          fx.splice(i, 1);
        }
      }
    }

    var mg = $('mm').getContext('2d');
    function drawMap() {
      var HF = Math.atan(Math.tan(FOV * Math.PI / 360) * W / H);
      mg.clearRect(0, 0, 112, 112);
      mg.fillStyle = 'rgba(15, 23, 42, 0.88)';
      mg.fillRect(0, 0, 112, 112);
      var ox = 56, oy = 104, sc = 92 / 28;
      mg.beginPath();
      mg.moveTo(ox, oy);
      mg.lineTo(ox - Math.tan(HF) * 28 * sc, oy - 28 * sc);
      mg.lineTo(ox + Math.tan(HF) * 28 * sc, oy - 28 * sc);
      mg.closePath();
      mg.fillStyle = 'rgba(245, 158, 11, 0.14)';
      mg.fill();
      mg.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      mg.lineWidth = 0.8;
      [10, 20].forEach(function(r) {
        mg.beginPath();
        mg.arc(ox, oy, r * sc, Math.PI, Math.PI * 2);
        mg.stroke();
      });
      for (var i = 0; i < targets.length; i++) {
        var o = targets[i];
        var mx = clamp(ox + o.g.position.x * sc, 4, 108);
        var my = clamp(oy + o.g.position.z * sc, 4, 108);
        var rr = o.kind === 'boss' ? 6.5 : 4;
        mg.beginPath();
        mg.arc(mx, my, rr, 0, Math.PI * 2);
        if (o.kind === 'caslight') {
          mg.strokeStyle = o.c.col; mg.lineWidth = 1.8; mg.stroke();
        } else {
          mg.fillStyle = o.c.col; mg.fill();
        }
      }
      mg.fillStyle = '#EF9F27';
      for (var j = 0; j < items.length; j++) {
        var it = items[j];
        mg.fillRect(clamp(ox + it.g.position.x * sc, 2, 108) - 2, clamp(oy + it.g.position.z * sc, 2, 108) - 2, 5, 5);
      }
      mg.beginPath();
      mg.moveTo(ox, oy - 7); mg.lineTo(ox + 5, oy + 1); mg.lineTo(ox - 5, oy + 1);
      mg.closePath();
      mg.fillStyle = '#F8FAFC';
      mg.fill();
    }

    var segs = hpbar.children;
    function hud() {
      $('sc').textContent = S.score.toLocaleString();
      $('wv').textContent = S.wave;
      $('cb').textContent = S.combo + (S.combo >= 10 ? ' (게이지 x2)' : S.combo >= 5 ? ' (게이지 x1.5)' : '');
      $('am').textContent = S.fever ? '∞ (FEVER)' : (S.reloadT > 0 ? '장전 중...' : S.ammo + '/' + MAG);
      for (var i = 0; i < 10; i++) segs[i].style.background = i < S.hp ? '#E24B4A' : 'rgba(255,255,255,0.12)';
      var bf = [];
      if (S.fever) bf.push('🔥 FEVER ' + Math.ceil(S.feverT) + '초');
      if (S.rapidT > 0) bf.push('⚡ 카스 0.0 연사 ' + Math.ceil(S.rapidT) + '초');
      if (S.powerT > 0) bf.push('💥 카스 화이트 화력2배 ' + Math.ceil(S.powerT) + '초');
      if (S.shield) bf.push('🛡️ OB상자 보호막');
      $('bf').textContent = bf.length ? bf.join(' · ') : '효과 없음';
      $('ch').style.transform = 'translate(' + (cx - 32) + 'px,' + (cy - 32) + 'px)';
      $('fr').setAttribute('stroke-dashoffset', (163.4 * (1 - S.gauge / 100)).toFixed(1));
      var rl = $('rl');
      if (S.reloadT > 0) {
        rl.style.display = 'block';
        $('rlf').style.width = (100 * (1 - S.reloadT / RELOAD)) + '%';
      } else rl.style.display = 'none';
      $('pop').style.opacity = S.popT > 0 ? Math.min(1, S.popT / 0.4) : 0;
      $('pop2').style.opacity = S.pop2T > 0 ? Math.min(1, S.pop2T / 0.5) : 0;
      if (S.popT > 0) S.popT -= 0.016;
      if (S.pop2T > 0) S.pop2T -= 0.016;
      if (S.bnT > 0 && S.state === 'play') {
        S.bnT -= 0.016;
        if (S.bnT <= 0) $('bn').style.display = 'none';
      }
      if (S.state === 'break' && !S.over && S.wave > 0) {
        $('bn').textContent = 'WAVE ' + S.wave + ' 클리어 · 다음 웨이브까지 ' + Math.ceil(Math.max(S.breakT, 0)) + '초';
      }
      var boss = targets.find(function(o) { return o.kind === 'boss'; });
      if (boss) {
        $('boss').style.display = 'block';
        $('bossf').style.width = (100 * boss.hp / boss.maxhp) + '%';
      } else $('boss').style.display = 'none';
      var b3 = $('b3');
      b3.disabled = S.gauge < 100 || S.fever;
      b3.classList.toggle('rdy', S.gauge >= 100 && !S.fever);
      wrap.style.boxShadow = S.flashT > 0 ? 'inset 0 0 0 6px rgba(226,75,74,' + S.flashT + ')' : (S.fever ? 'inset 0 0 0 6px rgba(239,159,39,0.9)' : '0 16px 40px rgba(0,0,0,0.45)');
      if (S.flashT > 0) S.flashT -= 0.016;
    }

    function frame(ts) {
      var dt = Math.min((ts - last) / 1000, 0.05);
      last = ts;
      update(dt);
      updateFx(dt);
      S.recoil = Math.max(0, S.recoil - dt * 6);
      gun.position.z = -0.58 + S.recoil * 0.1;
      gun.rotation.y = -(cx / W - 0.5) * 0.6;
      gun.rotation.x = -(cy / H - 0.5) * 0.4;
      renderer.render(scene, cam);
      drawMap();
      hud();
      requestAnimationFrame(frame);
    }

    // Input handlers (Mouse / Pointer / Keyboard)
    wrap.addEventListener('pointerdown', function(e) { lx = e.clientX; ly = e.clientY; flick(); });
    wrap.addEventListener('pointerenter', function(e) { lx = e.clientX; ly = e.clientY; });
    wrap.addEventListener('pointerleave', function() { lx = null; });
    wrap.addEventListener('pointermove', function(e) {
      var rect = wrap.getBoundingClientRect();
      if (S.frozenT > 0) return;
      tx = clamp(e.clientX - rect.left, 0, W);
      ty = clamp(e.clientY - rect.top, 0, H);
    });

    var b1 = $('b1'), b2 = $('b2'), b3 = $('b3');
    b1.addEventListener('pointerdown', function(e) { e.preventDefault(); flick(); });
    function holdStart() { S.holdOn = true; S.holdT = 0; S.fireCd = 0; b2.classList.add('on'); }
    function holdEnd() {
      if (!S.holdOn) return;
      var short = S.holdT < HOLD_DELAY;
      S.holdOn = false;
      b2.classList.remove('on');
      if (short) {
        var now = performance.now();
        if (now - lastTap < DOUBLE_TAP) { fever(); lastTap = 0; }
        else lastTap = now;
      }
    }
    b2.addEventListener('pointerdown', function(e) { e.preventDefault(); b2.setPointerCapture(e.pointerId); holdStart(); });
    b2.addEventListener('pointerup', holdEnd);
    b2.addEventListener('pointercancel', holdEnd);
    b3.addEventListener('click', fever);
    $('rs').addEventListener('click', init);

    window.addEventListener('keydown', function(e) {
      if (e.repeat) return;
      if (e.code === 'Space') { e.preventDefault(); flick(); }
      if (e.code === 'KeyF') holdStart();
      if (e.code === 'KeyR') startReload();
      if (e.code === 'KeyE') fever();
    });
    window.addEventListener('keyup', function(e) { if (e.code === 'KeyF') holdEnd(); });

    setStageTheme(0);
    init();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
